# ═══════════════════════════════════════════════════════════════
# llama-server model presets for evaLLMate
# Usage: llama-server --models-preset /path/to/model-presets.conf
# ═══════════════════════════════════════════════════════════════
#
# Models WITHOUT an entry here use their embedded GGUF template
# (which works fine for Qwen3, Nemotron, MiniMax, etc.)
#
# Only models with broken/missing tool-calling templates need
# an explicit override below.
# ═══════════════════════════════════════════════════════════════

# ── Defaults for all models ──────────────────────────────────
[*]
jinja = true

# ── Qwen3.5 family (broken arguments iteration in official template) ──
[Qwen3.5-35B-A3B-UD-Q8_K_XL]
chat-template-file = /home/ubuntu/local-llm-toolbox/llama-cpp/templates/qwen3.5-tools.jinja

[Qwen3.5-122B-A10B-UD-Q8_K_XL]
chat-template-file = /home/ubuntu/local-llm-toolbox/llama-cpp/templates/qwen3.5-tools.jinja

[Qwen3.5-397B-A17B-IQ4_XS]
chat-template-file = /home/ubuntu/local-llm-toolbox/llama-cpp/templates/qwen3.5-tools.jinja

# ── GLM-4.7 family — embedded GGUF templates support tool calling natively ──
# (removed custom overrides: glm4-tools.jinja had [gMASK]<sop> as literal text
#  instead of bos_token, breaking the PEG parser stop detection)

# ── DeepSeek V3.1 (needs llama.cpp's custom DeepSeek template) ──
[DeepSeek-V3.1-Terminus-UD-Q2_K_XL]
chat-template-file = /home/ubuntu/local-llm-toolbox/llama-cpp/templates/deepseek-tools.jinja

# ── Devstral-Small-2 (role alternation + tool call parsing bugs) ──
[Devstral-Small-2-24B-Instruct-2512-Q8_0]
chat-template-file = /home/ubuntu/local-llm-toolbox/llama-cpp/templates/devstral-tools.jinja

# ── Llama-4-Scout (no native handler in llama.cpp, needs pythonic template) ──
[Llama-4-Scout-17B-16E-Instruct-Q4_K_M]
chat-template-file = /home/ubuntu/local-llm-toolbox/llama-cpp/templates/llama4-tools.jinja

# ── Models that work fine with embedded GGUF templates ───────
# (no override needed, listed here for documentation)
#
# [Qwen3-Coder-Next-BF16]              — Unsloth fixed template in GGUF
# [Qwen3-Coder-30B-A3B-Instruct-BF16]  — Unsloth fixed template in GGUF
# [Nemotron-3-Nano-30B-A3B-Q8_0]       — native llama.cpp support (PR #18058)
# [MiniMax-M2.5-Q4_K_M]                — works with --jinja generic handler
